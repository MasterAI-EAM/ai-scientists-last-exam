name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.8'
      - run: uv sync --locked
      - run: uv run python scripts/prepare.py --check
      # Shared root verifier + non-root agent: documented in ENVIRONMENT_CARD.md.
      - run: uv run harbor lint color_001 --ignore shared-verifier
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
